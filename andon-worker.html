<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ANDON · Worker Panel</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Share+Tech+Mono&family=Noto+Sans+Thai:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Sans Thai',sans-serif;background:#040810;color:#c0d8f0;
  min-height:100vh;display:flex;flex-direction:column;
  background-image:
    linear-gradient(180deg,#04091a 0%,#040810 100%),
    repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(0,80,160,.025) 60px,rgba(0,80,160,.025) 61px),
    repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(0,80,160,.025) 60px,rgba(0,80,160,.025) 61px);
}

/* HEADER */
.hdr{
  width:100%;background:rgba(2,5,16,.97);
  border-bottom:2px solid #081628;
  padding:10px 18px;
  display:flex;align-items:center;justify-content:space-between;
  position:relative;flex-shrink:0;
}
.hdr::after{
  content:'';position:absolute;bottom:-2px;left:0;right:0;height:2px;
  background:linear-gradient(90deg,transparent,#00b4ff 30%,#00e5cc 50%,#aa66ff 70%,transparent);
  opacity:.7;
}
.hdr-left{}
.hdr-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:5px;
  background:linear-gradient(90deg,#00b4ff,#00e5cc);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hdr-sub{font-family:'Share Tech Mono',monospace;font-size:.48rem;color:#1a3a58;letter-spacing:3px;margin-top:1px}
.hdr-logo{height:34px;width:auto;object-fit:contain;opacity:.92;filter:drop-shadow(0 0 7px rgba(0,100,255,.35))}
.hdr-right{text-align:right}
.hdr-stn{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:4px;color:#00b4ff}
.hdr-stn-sub{font-family:'Share Tech Mono',monospace;font-size:.48rem;color:#1a3a58;letter-spacing:2px}

/* CONN BAR */
.conn-bar{
  display:flex;align-items:center;gap:8px;
  background:rgba(0,0,0,.4);border-bottom:1px solid #081420;
  padding:5px 18px;
  font-family:'Share Tech Mono',monospace;font-size:.57rem;letter-spacing:2px;flex-shrink:0;
}
.dot{width:7px;height:7px;border-radius:50%;background:#222;flex-shrink:0;transition:all .3s}
.dot.on{background:#00e676;box-shadow:0 0 6px #00e676;animation:blink 2s infinite}
.dot.off{background:#ff1744;box-shadow:0 0 6px #ff1744}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
#ctxt{color:#2a6080}

/* CONTENT */
.content{flex:1;display:flex;flex-direction:column;align-items:center;padding:16px 16px 20px;max-width:560px;margin:0 auto;width:100%}

/* SECTION HEADER */
.sec-hdr{
  font-family:'Share Tech Mono',monospace;font-size:.56rem;letter-spacing:3px;
  color:#2a5070;margin-bottom:8px;width:100%;
  display:flex;align-items:center;gap:8px;
}
.sec-hdr::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,#0e1c2e,transparent)}

/* LINE SELECTOR */
.line-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;margin-bottom:20px}
.line-card{
  border-radius:12px;padding:16px 14px;
  position:relative;overflow:hidden;cursor:pointer;
  transition:all .2s;border:2px solid transparent;
}
.line-card.l1{background:linear-gradient(145deg,#04101e,#020810);border-color:#0e1c2e}
.line-card.l2{background:linear-gradient(145deg,#0c0418,#060210);border-color:#160830}
.line-card.l1.active{border-color:#00b4ff;box-shadow:0 0 20px rgba(0,180,255,.15)}
.line-card.l2.active{border-color:#aa66ff;box-shadow:0 0 20px rgba(170,100,255,.15)}
.line-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}
.l1::before{background:linear-gradient(180deg,#00b4ff,#00e5cc)}
.l2::before{background:linear-gradient(180deg,#aa66ff,#cc88ff)}
.lc-tag{
  font-family:'Bebas Neue',sans-serif;font-size:.72rem;letter-spacing:2px;
  padding:2px 10px;border-radius:20px;display:inline-block;margin-bottom:6px;
}
.l1 .lc-tag{background:rgba(0,180,255,.1);color:#00b4ff;border:1px solid rgba(0,180,255,.2)}
.l2 .lc-tag{background:rgba(170,100,255,.1);color:#bb88ff;border:1px solid rgba(170,100,255,.2)}
.lc-icon{font-size:2rem;margin:6px 0;display:block;text-align:center}
.lc-name{font-size:.75rem;color:#3a6080;text-align:center;line-height:1.5}
.l2 .lc-name{color:#6a4a90}
.lc-active-bar{
  margin-top:8px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,transparent,#00b4ff,transparent);
  opacity:0;transition:opacity .2s;
}
.l2 .lc-active-bar{background:linear-gradient(90deg,transparent,#aa66ff,transparent)}
.line-card.active .lc-active-bar{opacity:1}

/* STATUS BAR */
.sbar{
  width:100%;border-radius:12px;padding:14px 18px;
  display:flex;align-items:center;gap:12px;margin-bottom:16px;
  background:linear-gradient(135deg,#04111e,#020810);
  border:2px solid #0e1c2e;transition:all .3s;
  position:relative;overflow:hidden;
}
.sbar::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;
  background:#00e676;border-radius:0 3px 3px 0;transition:background .3s}
.sbar.call{border-color:rgba(255,214,0,.5);background:linear-gradient(135deg,#1a1400,#060400);box-shadow:0 0 20px rgba(255,214,0,.08)}
.sbar.call::before{background:#ffd600}
.sbar.breakdown{border-color:rgba(255,23,68,.5);background:linear-gradient(135deg,#180008,#060002);animation:pulse-r .8s ease-in-out infinite alternate}
.sbar.breakdown::before{background:#ff1744}
.sbar.acknowledged{border-color:rgba(0,180,255,.4);background:linear-gradient(135deg,#001828,#000810)}
.sbar.acknowledged::before{background:#00b4ff}
@keyframes pulse-r{from{box-shadow:0 0 0 rgba(255,23,68,0)}to{box-shadow:0 0 30px rgba(255,23,68,.2)}}
.sbar-ico{font-size:2rem;min-width:38px;text-align:center}
.sbar-info{flex:1}
.sbar-lbl{font-family:'Share Tech Mono',monospace;font-size:.5rem;color:#2a4a60;letter-spacing:2px}
.sbar-txt{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:5px;color:#00e676;line-height:1;transition:color .3s}
.sbar.call .sbar-txt{color:#ffd600}
.sbar.breakdown .sbar-txt{color:#ff1744}
.sbar.acknowledged .sbar-txt{color:#00b4ff}
.sbar-time{
  font-family:'Share Tech Mono',monospace;font-size:1.4rem;letter-spacing:2px;
  color:#2a4a60;transition:color .3s;text-align:right;
}
.sbar-time-lbl{font-family:'Share Tech Mono',monospace;font-size:.46rem;color:#1a3050;text-align:right;letter-spacing:1px}
.sbar.call .sbar-time{color:#ffd600}
.sbar.breakdown .sbar-time{color:#ff1744}
.sbar.acknowledged .sbar-time{color:#00b4ff}

/* ACK BADGE */
.ack-badge{
  display:none;background:rgba(0,180,255,.1);border:1px solid rgba(0,180,255,.3);
  border-radius:20px;padding:2px 10px;
  font-family:'Share Tech Mono',monospace;font-size:.52rem;color:#00b4ff;
  letter-spacing:2px;margin-top:3px;
}

/* ACTION BUTTONS */
.btn-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:100%;margin-bottom:16px}
.ab{
  border:none;border-radius:12px;padding:18px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:7px;
  transition:all .18s;font-family:'Noto Sans Thai',sans-serif;
  position:relative;overflow:hidden;
}
.ab:active{transform:scale(.94)}
.ab-ico{font-size:1.8rem}
.ab-txt{font-family:'Bebas Neue',sans-serif;font-size:.9rem;letter-spacing:2px;line-height:1.1;text-align:center}
.ab-sub{font-family:'Share Tech Mono',monospace;font-size:.48rem;letter-spacing:1px;opacity:.7}

/* CALL button */
.ab.bc{
  background:linear-gradient(145deg,#1a1000,#100a00);
  border:2px solid rgba(255,214,0,.3);color:#ffd600;
}
.ab.bc:hover{border-color:#ffd600;box-shadow:0 0 20px rgba(255,214,0,.2)}

/* BREAKDOWN button */
.ab.bb{
  background:linear-gradient(145deg,#1a0005,#100002);
  border:2px solid rgba(255,23,68,.3);color:#ff1744;
}
.ab.bb:hover{border-color:#ff1744;box-shadow:0 0 20px rgba(255,23,68,.2)}

/* RESET button */
.ab.br{
  background:linear-gradient(145deg,#001a08,#001005);
  border:2px solid rgba(0,230,118,.3);color:#00e676;
}
.ab.br:hover{border-color:#00e676;box-shadow:0 0 18px rgba(0,230,118,.18)}

/* LOG */
.log-panel{
  width:100%;background:#030810;border:1px solid #0a1628;border-radius:10px;padding:10px 12px;
}
.log-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.log-title{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:#00b4ff;letter-spacing:3px}
.log-box{
  background:#020608;border:1px solid #08101e;border-radius:6px;
  padding:7px 10px;height:130px;overflow-y:auto;
  font-family:'Share Tech Mono',monospace;font-size:.66rem;
}
.log-box::-webkit-scrollbar{width:3px}
.log-box::-webkit-scrollbar-thumb{background:#0e1c2e;border-radius:2px}
.le{display:flex;gap:8px;margin-bottom:3px}
.le .ts{color:#2a4060;white-space:nowrap}
.le.g .m{color:#00e676}.le.y .m{color:#ffd600}.le.r .m{color:#ff1744}.le.s .m{color:#2a4a6a}.le.b .m{color:#00b4ff}

/* OVERLAY */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;z-index:100;
  opacity:0;pointer-events:none;transition:opacity .2s;padding:20px;
}
.overlay.show{opacity:1;pointer-events:all}
.modal{
  background:#050d1a;border:1px solid #0e2040;border-radius:16px;padding:24px 20px;
  width:100%;max-width:360px;
}
.modal-ico{font-size:2.5rem;text-align:center;margin-bottom:8px}
.modal-title{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:4px;
  text-align:center;color:#e0f0ff;margin-bottom:4px}
.modal-desc{font-size:.78rem;color:#4a7090;text-align:center;margin-bottom:16px;line-height:1.7;white-space:pre-line}
.modal-lbl{font-family:'Share Tech Mono',monospace;font-size:.56rem;color:#3a6080;letter-spacing:1px;margin-bottom:5px}
.modal-inp{
  width:100%;background:#020810;border:1px solid #0e2040;border-radius:8px;
  padding:10px 12px;color:#c0d8f0;font-family:'Noto Sans Thai',sans-serif;font-size:.92rem;
  margin-bottom:10px;outline:none;transition:border-color .2s;
}
.modal-inp:focus{border-color:#00b4ff}
.modal-btns{display:flex;gap:10px;margin-top:8px}
.btn-yes{
  flex:2;background:linear-gradient(135deg,#005080,#003060);
  border:1px solid rgba(0,180,255,.4);border-radius:8px;
  padding:11px;color:#00b4ff;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:3px;
  cursor:pointer;transition:all .2s;
}
.btn-yes:hover:not(:disabled){background:linear-gradient(135deg,#006090,#004070);box-shadow:0 0 16px rgba(0,180,255,.2)}
.btn-yes:disabled{opacity:.35;cursor:not-allowed}
.btn-no{
  flex:1;background:rgba(0,0,0,.3);border:1px solid #0e2040;border-radius:8px;
  padding:11px;color:#3a6080;font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;
  cursor:pointer;transition:all .2s;
}
.btn-no:hover{border-color:#334060;color:#6a90b0}
.detail-wrap{display:none;margin-bottom:2px}
</style>
</head>

<script>
var CFG = {
  apiKey:"AIzaSyCsuwwUKEw01sXhVHt-1WcF94F5kNMiCOI",
  authDomain:"andon-system-7768d.firebaseapp.com",
  databaseURL:"https://andon-system-7768d-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId:"andon-system-7768d",
  storageBucket:"andon-system-7768d.firebasestorage.app",
  messagingSenderId:"35986723687",
  appId:"1:35986723687:web:34c48c4b2df30e8068d5c2"
};

var TYPES = {
  normal:       {icon:'✅',label:'NORMAL',          cls:'',             col:'g'},
  call:         {icon:'📞',label:'เรียกหัวหน้า',    cls:'call',         col:'y'},
  breakdown:    {icon:'⚠️',label:'เครื่องเสีย',     cls:'breakdown',    col:'r'},
  acknowledged: {icon:'🔵',label:'รับทราบแล้ว',    cls:'acknowledged', col:'b'}
};

var CF = {
  call:      {icon:'📞',title:'เรียกหัวหน้า',   desc:'ส่งสัญญาณแจ้งหัวหน้างาน\nห้องควบคุมจะรับแจ้งทันที'},
  breakdown: {icon:'⚠️',title:'แจ้งเครื่องเสีย', desc:'ส่งสัญญาณฉุกเฉิน\nเครื่องจักรขัดข้อง'},
  reset:     {icon:'♻️',title:'RESET ระบบ',     desc:'แก้ไขปัญหาแล้ว\nรีเซ็ตกลับสู่ปกติ'}
};

var curType='normal', stateTs=Date.now(), pending=null, dbRef=null;
var activeLine = 1;

function checkNameInput(){
  var v = document.getElementById('cfNameInp').value.trim();
  document.getElementById('btnYes').disabled = !v;
}

window.addEventListener('DOMContentLoaded', function(){
  render();
  setInterval(render, 1000);
  log('s','⚙ WORKER PANEL พร้อมใช้งาน');

  try {
    firebase.initializeApp(CFG);
    dbRef = firebase.database().ref('andon/station01');
    dbRef.on('value', function(snap){
      setOnline(true);
      var d = snap.val();
      if(d && d.type){ curType=d.type; stateTs=d.timestamp||Date.now(); render(); }
    }, function(e){ setOnline(false); log('s','⚡ '+e.message); });
    setOnline(true);
  } catch(e){ setOnline(false); log('s','⚡ Firebase ไม่พร้อม: '+e.message); }
});

function selectLine(n){
  activeLine = n;
  document.getElementById('lbtn1').className='line-card l1'+(n===1?' active':'');
  document.getElementById('lbtn2').className='line-card l2'+(n===2?' active':'');
  var stationRef = n===1?'andon/station01':'andon/station02';
  var lineName   = n===1?'Base Coat / Clear Coat':'New Primer';
  if(dbRef) dbRef.off();
  dbRef = firebase.database().ref(stationRef);
  dbRef.on('value', function(snap){
    setOnline(true);
    var d = snap.val();
    if(d && d.type){ curType=d.type; stateTs=d.timestamp||Date.now(); render(); }
  }, function(e){ setOnline(false); });
  log('s','🔄 เปลี่ยนเป็น LINE '+n+' — '+lineName);
}

function ask(type){
  pending = type;
  var c = CF[type]||{};
  document.getElementById('cfIco').textContent   = c.icon||'❓';
  document.getElementById('cfTitle').textContent = c.title||type;
  document.getElementById('cfDesc').textContent  = c.desc||'';
  document.getElementById('cfNameLbl').textContent = (type==='reset')
    ? '▸ ชื่อผู้แก้ไข · FIXER (บังคับ)'
    : '▸ ชื่อผู้แจ้ง · REPORTER (บังคับ)';
  var saved = '';
  try{ saved = localStorage.getItem('andon_reporter') || ''; }catch(e){}
  document.getElementById('cfNameInp').value = saved;
  document.getElementById('btnYes').disabled = !saved.trim();
  var showDetail = (type==='call' || type==='breakdown');
  document.getElementById('detailWrap').style.display = showDetail ? 'block' : 'none';
  document.getElementById('detailInp').value = '';
  document.getElementById('overlay').classList.add('show');
  setTimeout(function(){
    var inp = document.getElementById('cfNameInp');
    if(!inp.value.trim()) inp.focus();
    else if(showDetail) document.getElementById('detailInp').focus();
  }, 300);
}

function closeOv(){
  document.getElementById('overlay').classList.remove('show');
}

document.getElementById('overlay').addEventListener('click', function(e){
  if(e.target===this) closeOv();
});

function doSend(){
  var nameVal = document.getElementById('cfNameInp').value.trim();
  if(!nameVal){ document.getElementById('cfNameInp').focus(); return; }
  try{ localStorage.setItem('andon_reporter', nameVal); }catch(e){}
  closeOv();
  if(!pending) return;
  var realType = (pending==='reset') ? 'normal' : pending;
  var lineName = activeLine===1?'Base Coat / Clear Coat':'New Primer';
  var detail   = document.getElementById('detailInp').value.trim();
  var pl = {
    type:realType, station:'LINE-'+activeLine, name:lineName,
    detail:detail||'', reporter:nameVal, timestamp:Date.now()
  };
  curType=realType; stateTs=pl.timestamp; render();
  if(dbRef){
    dbRef.set(pl).then(function(){
      var msg = realType==='normal' ? 'แก้ไขแล้ว' : TYPES[realType].label;
      if(detail) msg += ' · '+detail;
      log(TYPES[realType].col,'📤 ส่งแล้ว: '+msg+' ['+nameVal+']');
    }).catch(function(e){ log('s','⚡ ส่งไม่ได้: '+e.message); });
  } else {
    log('s','⚡ ไม่มี Firebase — กรุณาตรวจสอบ internet');
  }
  if(navigator.vibrate) navigator.vibrate(realType==='normal'?50:[200,80,200]);
  pending = null;
}

function render(){
  var t = TYPES[curType]||TYPES.normal;
  document.getElementById('sbar').className   = 'sbar '+t.cls;
  document.getElementById('sico').textContent = t.icon;
  document.getElementById('stxt').textContent = t.label;
  var badge = document.getElementById('ackBadge');
  badge.style.display = (curType==='acknowledged') ? 'inline-flex' : 'none';
  var s=Math.floor((Date.now()-stateTs)/1000);
  document.getElementById('stime').textContent =
    String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

function setOnline(ok){
  var d=document.getElementById('dot'), t=document.getElementById('ctxt');
  d.className='dot '+(ok?'on':'off');
  t.textContent=ok?'ONLINE · FIREBASE CONNECTED':'OFFLINE · RECONNECTING...';
  t.style.color=ok?'#00e676':'#ff1744';
}

function log(col,msg){
  var b=document.getElementById('logBox');
  var now=new Date().toLocaleTimeString('th-TH',{hour12:false});
  var el=document.createElement('div'); el.className='le '+col;
  el.innerHTML='<span class="ts">['+now+']</span><span class="m">'+msg+'</span>';
  b.appendChild(el); b.scrollTop=b.scrollHeight;
  if(b.children.length>80) b.removeChild(b.firstChild);
}
</script>
